name: Release WordPress plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and package plugin
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/plugin-release"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="celestial-cookie-consent-${GITHUB_REF_NAME#v}.zip"
          release_dir="$RUNNER_TEMP/plugin-release"
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > "$release_dir/assets.txt"; then
            if ! grep -Fxq "$asset" "$release_dir/assets.txt"; then
              gh release upload "$GITHUB_REF_NAME" "$release_dir/$asset"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$release_dir/$asset" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$release_dir/release-notes.md"
          fi
